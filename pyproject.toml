[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice"
version = "4.15.0"
description = "Music library toolkit: tree, integrity, art, duplicates, tag audit"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
  {name = "vrnvctss"}
]
dependencies = [
     "vir-tui",
    "mutagen>=1.46.0",
    "tqdm>=4.65.0"
]

[project.scripts]
lattice = "lattice.cli:main"

[project.optional-dependencies]
pyinstaller = ["pyinstaller>=6.0"]

[tool.hatch.envs.default]
dependencies = [
     "vir-tui",
    "pyinstaller>=6.0"
]

[tool.hatch.envs.default.scripts]
build-bin = "pyinstaller --onefile --name lattice --paths src src/lattice/__main__.py"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
vir-tui = { path = "../vir-tui", editable = true }
